<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcritor Mari</title>
  <meta name="description" content="Grave, envie áudios e vídeos e obtenha transcrições editáveis com resumo, direto no navegador.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23116466'/><path d='M8 18v-4M12 22V10M16 25V7M20 21v-10M24 17v-2' stroke='%23ffd9a0' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M8 18v-4M12 22V10M16 25V7M20 21v-10M24 17v-2"/></svg>
        </span>
        <span class="brand-name">Transcritor <em>Mari</em></span>
      </a>
      <nav class="nav">
        <a href="#/novo" data-route="novo" class="nav-cta">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova transcrição
        </a>
        <a href="#/" data-route="biblioteca">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Minhas transcrições
        </a>
        <a href="#/config" data-route="config">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Configurações
        </a>
      </nav>
      <div class="sidebar-foot">
        <p>Tudo fica salvo no seu navegador. Nenhum áudio é enviado a servidores, exceto o texto que você pedir para a IA resumir.</p>
      </div>
    </aside>

    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand small" href="#/"><span class="brand-name">Transcritor <em>Mari</em></span></a>
    </header>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
